<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teemo Portfolio — POLARIS PASS</title>
    <meta
      name="description"
      content="Teemo 的 POLARIS PASS 视觉设计项目展示。"
    />
    <link rel="preload" as="video" href="./test/Teemo-hero-background-v2.mp4" type="video/mp4" />
    <link rel="stylesheet" href="./Teemo-project-showcase.css?v=20260729" />
    <script src="./Teemo-project-media.js?v=20260729-2" defer></script>
  </head>
  <body>
    <header class="Teemo-site-header" aria-label="主导航">
      <a class="Teemo-brand" href="#home" aria-label="返回首页">
        <img src="./sucai/Logo.png" alt="TEEMO" />
      </a>
      <nav class="Teemo-site-nav" aria-label="页面导航">
        <a href="#home">Home</a>
        <a href="#project">Project Case</a>
      </nav>
      <a class="Teemo-header-chip" href="#project">VIEW PROJECT</a>
    </header>

    <main>
      <section class="Teemo-hero" id="home" aria-label="POLARIS PASS 项目头图">
        <video
          class="Teemo-hero-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          fetchpriority="high"
          data-Teemo-hero-video
          aria-hidden="true"
        >
          <source src="./test/Teemo-hero-background-v2.mp4" type="video/mp4" />
        </video>
        <a class="Teemo-scroll-cue" href="#project" aria-label="向下查看项目内容">
          <span>SCROLL TO EXPLORE</span>
          <i aria-hidden="true"></i>
        </a>
      </section>

      <section class="Teemo-project-content" id="project" aria-label="POLARIS PASS 项目内容">
        <article class="Teemo-project-block" aria-label="第一组项目设计">
          <video
            class="Teemo-project-video"
            muted
            loop
            playsinline
            preload="metadata"
            data-Teemo-project-video
            aria-label="POLARIS PASS 第一组动态设计"
          >
            <source src="./test/Teemo-kv1-v2.mp4" type="video/mp4" />
          </video>
          <img
            src="./test/Teemo-video-1-still-v2.png"
            alt="POLARIS PASS 第一组单卡视觉设计"
            loading="lazy"
          />
          <img
            src="./test/1.png"
            alt="POLARIS PASS 第一组桌面端与移动端设计说明"
            loading="lazy"
          />
        </article>

        <article class="Teemo-project-block" aria-label="第二组项目设计">
          <video
            class="Teemo-project-video"
            muted
            loop
            playsinline
            preload="metadata"
            data-Teemo-project-video
            aria-label="POLARIS PASS 第二组卡盒动态设计"
          >
            <source src="./test/Teemo-kv2-v2.mp4" type="video/mp4" />
          </video>
          <img
            src="./test/Teemo-video-2-still-v2.png"
            alt="POLARIS PASS 第二组卡盒视觉设计"
            loading="lazy"
          />
          <img
            src="./test/2.png"
            alt="POLARIS PASS 第二组桌面端与移动端设计说明"
            loading="lazy"
          />
        </article>

        <article class="Teemo-project-block" aria-label="第三组项目设计">
          <video
            class="Teemo-project-video"
            muted
            loop
            playsinline
            preload="metadata"
            data-Teemo-project-video
            aria-label="POLARIS PASS 第三组手持卡片动态设计"
          >
            <source src="./test/Teemo-kv3-v2.mp4" type="video/mp4" />
          </video>
          <img
            src="./test/Teemo-video-3-still-v2.png"
            alt="POLARIS PASS 第三组手持卡片视觉设计"
            loading="lazy"
          />
          <img
            src="./test/3.png"
            alt="POLARIS PASS 第三组桌面端与移动端设计说明"
            loading="lazy"
          />
        </article>

        <figure class="Teemo-project-extension">
          <img
            src="./test/Teemo-POLARIS-IP-extension.png?v=20260729-2"
            alt="POLARIS IP 角色动作、表情与九组延展设计"
            loading="lazy"
          />
        </figure>
      </section>

      <section class="Teemo-contact" id="contact" aria-label="联系方式">
        <div class="Teemo-contact-grid">
          <a class="Teemo-contact-tile" href="mailto:teeemowang@gmail.com">
            <span class="Teemo-tile-icon" aria-hidden="true">
              <img src="./sucai/icon/E-mail.png" alt="" />
            </span>
            <h2>Email</h2>
            <p>teeemowang@gmail.com</p>
          </a>

          <a class="Teemo-contact-tile" href="tel:+8615138863889">
            <span class="Teemo-tile-icon" aria-hidden="true">
              <img src="./sucai/icon/tel.png" alt="" />
            </span>
            <h2>Phone</h2>
            <p>+86 151 3886 3889</p>
          </a>

          <article class="Teemo-contact-tile">
            <span class="Teemo-tile-icon" aria-hidden="true">
              <img src="./sucai/icon/wechat.png" alt="" />
            </span>
            <h2>WeChat</h2>
            <p>15138863889</p>
          </article>

          <a
            class="Teemo-contact-tile"
            href="https://www.xiaohongshu.com/user/profile/5b6e77b1f7e8b9731d7cbdd1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="Teemo-tile-icon" aria-hidden="true">
              <img src="./sucai/icon/red.png" alt="" />
            </span>
            <h2>RED</h2>
            <p>xiaohongshu.com</p>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
